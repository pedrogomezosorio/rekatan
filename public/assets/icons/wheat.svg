<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="wheatBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="55%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <linearGradient id="grainGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#wheatBg)" stroke="#d4af37" stroke-width="3" />
  <!-- Golden Wheat Stalks -->
  <path d="M24,52 Q30,34 22,14" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32,53 Q32,32 32,11" fill="none" stroke="#fef08a" stroke-width="2.8" stroke-linecap="round" />
  <path d="M40,52 Q34,34 42,14" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <!-- Grains -->
  <ellipse cx="28" cy="20" rx="3.5" ry="6" transform="rotate(-25 28 20)" fill="url(#grainGold)" stroke="#78350f" stroke-width="1" />
  <ellipse cx="36" cy="20" rx="3.5" ry="6" transform="rotate(25 36 20)" fill="url(#grainGold)" stroke="#78350f" stroke-width="1" />
  <ellipse cx="27" cy="29" rx="3.8" ry="6.2" transform="rotate(-28 27 29)" fill="url(#grainGold)" stroke="#78350f" stroke-width="1" />
  <ellipse cx="37" cy="29" rx="3.8" ry="6.2" transform="rotate(28 37 29)" fill="url(#grainGold)" stroke="#78350f" stroke-width="1" />
  <ellipse cx="32" cy="14" rx="3.5" ry="6" fill="url(#grainGold)" stroke="#78350f" stroke-width="1" />
  <!-- Ribbon Tie -->
  <rect x="25" y="42" width="14" height="4.5" rx="2" fill="#dc2626" stroke="#fef08a" stroke-width="1" />
