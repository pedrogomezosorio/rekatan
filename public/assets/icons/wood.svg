<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="woodBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="55%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <linearGradient id="logBark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <radialGradient id="logCut" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#woodBg)" stroke="#d4af37" stroke-width="3" />
  <!-- Pine Trees Silhouette -->
  <polygon points="22,10 12,26 17,26 10,38 34,38 27,26 32,26" fill="#14532d" stroke="#bbf7d0" stroke-width="1" />
  <polygon points="41,12 32,27 36,27 30,38 52,38 46,27 50,27" fill="#166534" stroke="#bbf7d0" stroke-width="1" />
  <!-- Stacked Timber Logs -->
  <rect x="14" y="39" width="32" height="10" rx="5" fill="url(#logBark)" stroke="#291202" stroke-width="1.5" />
  <circle cx="44" cy="44" r="5" fill="url(#logCut)" stroke="#451a03" stroke-width="1.5" />
  <circle cx="44" cy="44" r="2.2" fill="none" stroke="#92400e" stroke-width="0.9" />
  <rect x="18" y="31" width="28" height="9" rx="4.5" fill="url(#logBark)" stroke="#291202" stroke-width="1.5" />
  <circle cx="44" cy="35.5" r="4.5" fill="url(#logCut)" stroke="#451a03" stroke-width="1.5" />
  <circle cx="44" cy="35.5" r="1.8" fill="none" stroke="#92400e" stroke-width="0.8" />
